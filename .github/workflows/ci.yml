name: UTINOCHATV1 Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: utinochatv1-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: https://jcblfgrcsgbdeamogzfc.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_9qBGewmR-UHx6Pc3_Gl36Q_7WhHCw2K

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Generate lockfile when absent
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies with npm ci
        run: npm ci --no-audit --no-fund
      - name: Static architecture and secret audit
        run: npm run audit
      - name: Finalize UTINOCHATV1 source
        run: node scripts/finalize-utino.mjs
      - name: Production build
        run: npm run build
      - name: Verify static export
        shell: bash
        run: |
          set -euo pipefail
          test -f out/index.html
          test -f out/404.html
          test -d out/_next/static
          grep -q "UTINOCHATV1" out/index.html
          test "$(find out -type f | wc -l)" -gt 10
      - name: Upload validated build artifact
        uses: actions/upload-artifact@v4
        with:
          name: utinochatv1-static-export
          path: out
          if-no-files-found: error
          retention-days: 3

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Generate lockfile when absent
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies with npm ci
        run: npm ci --no-audit --no-fund
      - name: Download validated build artifact
        uses: actions/download-artifact@v4
        with:
          name: utinochatv1-static-export
          path: out
      - name: Verify deployment artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f out/index.html
          test -f out/404.html
          test -d out/_next/static
          grep -q "UTINOCHATV1" out/index.html
      - name: Publish note
        run: |
          echo "Validated static export is ready for Vercel, Netlify, GitHub Pages, or another static host."
          echo "Cloudflare Workers/Wrangler deployment is intentionally disabled."
