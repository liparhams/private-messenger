name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: messenger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Apply Utino UI patches
        run: node scripts/apply-utino-patches.mjs

      - name: Production build
        run: npm run build

      - name: Verify static export
        shell: bash
        run: |
          set -euo pipefail
          test -f out/index.html
          test -f out/404.html
          test -d out/_next/static
          grep -q "Messenger" out/index.html
          test "$(find out -type f | wc -l)" -gt 10

      - name: Validate Cloudflare deployment package
        run: npx wrangler deploy --dry-run

      - name: Upload validated build artifact
        uses: actions/upload-artifact@v4
        with:
          name: messenger-static-export
          path: out
          if-no-files-found: error
          retention-days: 3

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Download validated build artifact
        uses: actions/download-artifact@v4
        with:
          name: messenger-static-export
          path: out

      - name: Verify deployment artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f out/index.html
          test -f out/404.html
          test -d out/_next/static
          grep -q "Messenger" out/index.html

      - name: Deploy exact validated artifact to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
