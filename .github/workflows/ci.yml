name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production build
        run: npm run build

      - name: Verify static export
        shell: bash
        run: |
          test -f out/index.html
          test -d out/_next
          test -d out/_next/static
          grep -q "Messenger" out/index.html
